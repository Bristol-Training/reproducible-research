# Course settings shared by every page. This is the main file to edit when
# starting a new course. Colours, logo and fonts are in _brand.yml; custom styles are in custom.scss.

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - notes.qmd
    - slides.qmd
    - instructor.qmd
  resources:
    - example-project.zip

author: "Dr Josh Tyler - Jean Golding Institute"

# Keep the results of code chunks, and only re-run a page's code when that
# page changes. The GitHub Action stores the results between runs.
execute:
  freeze: auto

website:
  title: "Reproducible Research"
  # No menu items: the home page has the links. The navbar shows the logo
  # and title (which link back to the home page), and a GitHub icon on the right.
  navbar:
    right:
      - icon: github
        href: https://github.com/Bristol-Training/reproducible-research
        aria-label: GitHub repository
  page-footer: "[Jean Golding Institute](https://www.bristol.ac.uk/golding/) © CC-BY 4.0"

# Website pages (index, notes, instructor)
format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 2
    toc-expand: false
    # explicit grid so the right-hand contents column keeps its width
    grid:
      sidebar-width: 250px
      body-width: 1000px
      margin-width: 250px
      gutter-width: 1.5rem
    toc-title: "Contents"
    # external links open in a new tab (internal links on index.qmd set target="_blank" themselves)
    link-external-newwindow: true
    number-sections: true
    highlight-style: github
    fig-width: 7
    fig-height: 4.5

  # Slides
  revealjs:
    footer: "[Jean Golding Institute](https://www.bristol.ac.uk/golding/) © CC-BY 4.0"
    slide-number: true
    # keep slide changes out of the browser history, so Back leaves the slides
    history: false
    code-line-numbers: false
    # wrap long lines instead of scrolling sideways
    code-overflow: wrap
    highlight-style: github
    transition: none
    fig-width: 8
    fig-height: 4.5
    fig-align: center
    theme: [default, custom.scss]
