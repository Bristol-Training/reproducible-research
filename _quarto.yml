# Course settings shared by every page. This is the main file to edit when
# starting a new course. Colours, logo and fonts are in _brand.yml; custom styles are in custom.scss.

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - notes.qmd
    - slides.qmd
    - instructor.qmd

author: "Jean Golding Institute"

website:
  title: "Course Title"
  # No menu items: the home page has the links. The navbar just shows the
  # logo and title, which link back to the home page from every other page.
  navbar: {}
  page-footer: "[Jean Golding Institute](https://www.bristol.ac.uk/golding/) © CC-BY 4.0"

# Website pages (index, notes, instructor)
format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 2
    # explicit grid so the right-hand contents column keeps its width
    grid:
      sidebar-width: 250px
      body-width: 1000px
      margin-width: 250px
      gutter-width: 1.5rem
    toc-title: "Contents"
    # external links open in a new tab (internal links on index.qmd set target="_blank" themselves)
    link-external-newwindow: true
    number-sections: true
    highlight-style: github
    fig-width: 7
    fig-height: 4.5

  # Slides
  revealjs:
    footer: "[Jean Golding Institute](https://www.bristol.ac.uk/golding/) © CC-BY 4.0"
    slide-number: true
    # keep slide changes out of the browser history, so Back leaves the slides
    history: false
    code-line-numbers: false
    highlight-style: github
    transition: fade
    transition-speed: fast
    fig-width: 8
    fig-height: 4.5
    fig-align: center
    theme: [default, custom.scss]
