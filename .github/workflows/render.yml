# Renders the course and publishes the website to GitHub Pages.
#
#   push to main      render and publish
#   pull request      render only (nothing is published)
#   Run workflow      manual render and publish (Actions tab → Render course → Run workflow)
#
# The rendered website can be
# downloaded from each run's summary page under "Artifacts".
name: Render course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # The example notes use R code chunks. Add any extra packages your
      # course needs to `packages`. For Python, replace these two steps with
      # actions/setup-python and `pip install jupyter <your packages>`.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render
        run: quarto render

      - name: Upload course materials
        uses: actions/upload-artifact@v4
        with:
          name: course-materials
          path: _site

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
