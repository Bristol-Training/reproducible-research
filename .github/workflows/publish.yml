# Render the course website and publish it to the gh-pages branch.
# Runs on every push to main, and can be started by hand from the Actions tab
# (Actions > Publish website > Run workflow).
#
# Code chunks are frozen (`freeze: auto` in _quarto.yml): the results are kept
# in this Action's cache, and a page's code only re-runs when that page changes.
# R and Python are installed only when a page that changed needs them.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build example-project.zip
        run: python3 build_example_zip.py

      - name: Work out which languages the pages use
        id: deps
        run: python3 .github/scripts/detect_deps.py

      # Frozen code results from earlier runs. An exact match means no page
      # has changed, so nothing needs to run.
      - name: Restore frozen code results
        id: freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ hashFiles('*.qmd', '_quarto.yml', 'requirements.txt') }}
          restore-keys: freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        if: steps.deps.outputs.r == 'true' && steps.freeze.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        if: steps.deps.outputs.r == 'true' && steps.freeze.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ steps.deps.outputs.r_packages }}

      - name: Install Python packages
        if: steps.deps.outputs.python == 'true' && steps.freeze.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install ${{ steps.deps.outputs.py_packages }}
          # optional: anything the automatic check misses, or pinned versions
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
